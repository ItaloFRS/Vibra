      }

<div class="flex items-center gap-4 mb-8">
<div class="w-16 h-16 rounded-full overflow-hidden flex-shrink-0 bg-surface-container-highest">
<img class="w-full h-full object-cover" data-alt="vibrant neon music festival stage at night with purple and orange laser lights and a crowd silhouette" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDK0LDiSgPfRItvntasuxZ3jbk90Ql5ehA8QlcPsk7B7-M_En0WEJl2nCVVkJveVQSPRDrazo-sLRpRWDfpIWxcB8-FZ0mysHNes2LJVgCtCvRvJGvWklkiHDP86c8cXXZzcFV2tRSQq3Y2T4qGtYwcAlWT4Uz63aXNSR4tDWTXHqKNgbcnLdW_Y3NIy_cf7LIyF07Cpi8LB-MZNbdE_vP5UeLn-tRTZl028kQWtINcyeKoezBdof_JhiG2LKlkMPwSFKB3uyD7ZNk"/>

<span class="material-symbols-outlined text-sm">location_on</span> Arena Vibra
                    </p>

</div>

<span class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant/60">Setor</span>

<div class="flex flex-col">
<span class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant/60">Assento</span>
<span class="font-bold text-lg text-on-surface">B / 14</span>
</div>
</div>
<div class="mt-8 pt-6 border-t border-outline-variant/15">

<span class="flex items-center gap-2">
<span class="material-symbols-outlined">map</span>
                        Abrir localização no Maps
                    </span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">chevron_right</span>
</a>
