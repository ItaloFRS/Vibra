<header class="bg-[#FFF4EF] dark:bg-stone-950 w-full top-0 sticky z-50 flex items-center justify-between px-6 py-4 w-full">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#954400] dark:text-[#FB8B3F] hover:opacity-80 transition-opacity scale-95 active:scale-90 transition-transform cursor-pointer" data-icon="close">close</span>
</div>
<div class="font-['Plus_Jakarta_Sans'] font-bold tracking-tight text-[#954400] dark:text-[#FB8B3F] text-xl font-black">
            Pulse Match
        </div>
<div class="w-6"></div> <!-- Spacer for center alignment -->
</header>
<main class="min-h-[calc(100vh-72px)] flex flex-col items-center justify-center px-6 pb-12 overflow-hidden relative">
<!-- Background Decorative Elements (The Living Pulse) -->
<div class="absolute top-1/4 -right-20 w-80 h-80 bg-primary-container opacity-10 rounded-full blur-[80px] pointer-events-none"></div>
<div class="absolute bottom-1/4 -left-20 w-60 h-60 bg-secondary-container opacity-20 rounded-full blur-[60px] pointer-events-none"></div>
<!-- High-impact Editorial Headline -->
<div class="text-center mb-12 relative z-10">
<h1 class="text-[3.5rem] md:text-[5rem] font-headline font-extrabold tracking-tighter leading-none text-on-surface mb-2">
                Deu <span class="text-primary-container block md:inline">Match!</span>
</h1>
<p class="text-lg md:text-xl text-on-surface-variant max-w-xs mx-auto md:max-w-md font-medium leading-tight">
                Você e Elena estão na mesma vibe para o Neon Dreams Festival 2024.
            </p>
</div>
<!-- Overlapping Editorial Portrait Layout -->
<div class="relative flex items-center justify-center mb-16 w-full max-w-md">
<!-- Pulse Ribbon Decoration -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="w-full h-1 editorial-pulse rotate-[-15deg] opacity-20 blur-sm"></div>
</div>
<div class="relative flex">
<!-- User Photo -->
<div class="relative z-20 -mr-6 md:-mr-10 transition-transform hover:scale-105 duration-500">
<div class="w-36 h-36 md:w-56 md:h-56 rounded-full overflow-hidden border-8 border-surface-container-lowest shadow-[0_12px_40px_rgba(72,38,3,0.12)]">

</div>

<span class="material-symbols-outlined text-sm block" data-icon="bolt">bolt</span>
</div>
</div>
<!-- Match Photo -->
<div class="relative z-10 mt-12 md:mt-20 transition-transform hover:scale-105 duration-500">
<div class="w-36 h-36 md:w-56 md:h-56 rounded-full overflow-hidden border-8 border-surface-container-lowest shadow-[0_12px_40px_rgba(72,38,3,0.12)]">
<img alt="Elena profile photo" class="w-full h-full object-cover" data-alt="Young woman with bright neon makeup and festival attire, smiling radiantly with colorful lights in the background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAJOAyCcbCL_X3Czp6UiNP-DDL4RwPTGl_WMSBAyCNYIzXMfeARxHYzcl3DO8HwmQZ3tl-_7o9Zf0MJqAvFzmGUxWCyK5LEnkGlYBBLcpvg6M7ulONggrwXTi-v-Z7KzqoKvzaTTZF8rl-YHtEOZKfxUKdobdwDje9xMAStAHCoMTpF37Yqm4ZaBKg88iqNKfGOPOROi3Ri6qAXlDAAsJe7A8Ayl_R0vFgDAuhrsgg8dsAigCTgh34rEDdHnkXOUmw1-uUjGQTzfBo"/>

<div class="absolute top-2 left-2 md:top-6 md:left-6 bg-primary-container text-on-primary-fixed p-2 rounded-full shadow-lg">
<span class="material-symbols-outlined text-sm block" data-icon="favorite" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
</div>
</div>
</div>
<!-- Action Section -->
<div class="w-full max-w-sm flex flex-col gap-4 relative z-20">
<!-- Primary Action -->
<button class="editorial-pulse text-on-primary-fixed py-5 px-8 rounded-full font-bold text-lg shadow-[0_12px_40px_rgba(251,139,63,0.25)] hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-3">
<span class="material-symbols-outlined" data-icon="send">send</span>
                Enviar Mensagem
            </button>
<!-- Secondary Action -->
<button class="bg-surface-container-low text-on-surface py-5 px-8 rounded-full font-bold text-lg hover:bg-surface-container-high active:scale-[0.98] transition-all flex items-center justify-center gap-3">
                Continuar no Match
            </button>
</div>

<div class="mt-12 p-6 bg-surface-container-lowest/60 backdrop-blur-xl rounded-xl max-w-sm w-full shadow-[0_12px_40px_rgba(72,38,3,0.08)] flex items-center gap-4">

</div>
<div>

<p class="text-sm font-medium text-on-surface leading-snug">

                </p>
</div>
